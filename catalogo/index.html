<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tomate un Mate · Catálogo</title>
<meta name="description" content="Catálogo de mates, bombillas y accesorios de Tomate un Mate.">
<meta name="theme-color" content="#f6f1ea">

<!-- Cómo se ve el link cuando se comparte por WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:title" content="Tomate un Mate · Catálogo">
<meta property="og:description" content="Mates, bombillas y accesorios.">
<meta property="og:image" content="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg">

<link rel="icon" href="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
    color-scheme:light;
    --papel:#f6f1ea;
    --tinta:#2b211c;
    --tinta-suave:#6a5e55;
    --linea:#ddd2c6;
    --acento:#6e3826;
    --acento-oscuro:#4d2518;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Jost', system-ui, -apple-system, sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
    font-family:var(--sans);
    background:var(--papel);
    color:var(--tinta);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
}

/* Lo que el navegador dibuja por su cuenta, con los colores de la marca */

::selection{
    background:var(--acento);
    color:white;
}

:focus-visible{
    outline:2px solid var(--acento);
    outline-offset:3px;
}

button{ font-family:inherit; }

/* ---------- Portada ---------- */

header{
    text-align:center;
    padding:56px 20px 40px;
}

.logo{
    width:76px;
    height:76px;
    border-radius:50%;
    object-fit:cover;
}

header h1{
    margin-top:18px;
    font-family:var(--serif);
    font-weight:600;
    font-size:40px;
    line-height:1.1;
    letter-spacing:.04em;
    color:var(--acento);
}

.subtitulo{
    margin-top:12px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--tinta-suave);
}

/* ---------- Navegación por categoría ---------- */

.barraCategorias{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(246,241,234,.94);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--linea);
    border-bottom:1px solid var(--linea);
}

.categorias{
    display:flex;
    justify-content:center;
    gap:34px;
    max-width:1180px;
    margin:0 auto;
    padding:0 20px;
    overflow-x:auto;
    scrollbar-width:none;
}

.categorias::-webkit-scrollbar{ display:none; }

.categorias:empty{ display:none; }

.enlaceCategoria{
    flex-shrink:0;
    white-space:nowrap;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:16px 2px 14px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    cursor:pointer;
    transition:color .2s, border-color .2s;
}

@media (hover:hover) and (pointer:fine){

    .enlaceCategoria:hover{ color:var(--acento); }

}

.enlaceCategoria.activo{
    color:var(--acento);
    border-bottom-color:var(--acento);
}

.enlaceCategoria sup{
    font-size:10px;
    margin-left:3px;
    letter-spacing:0;
}

/* ---------- Secciones ---------- */

main{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px 24px;
}

#contenido{ scroll-margin-top:64px; }

.seccion{ padding-top:64px; }

.encabezadoSeccion{
    display:flex;
    align-items:baseline;
    gap:20px;
}

.encabezadoSeccion h2{
    font-family:var(--serif);
    font-weight:500;
    font-style:italic;
    font-size:44px;
    line-height:1;
    color:var(--tinta);
}

.encabezadoSeccion .regla{
    flex:1;
    height:1px;
    background:var(--linea);
    transform:translateY(-6px);
}

.encabezadoSeccion small{
    font-size:12px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--tinta-suave);
}

.grilla{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:56px 36px;
    margin-top:36px;
}

/* ---------- Producto ---------- */

.pieza{
    display:flex;
    flex-direction:column;
}

.foto{
    position:relative;
    aspect-ratio:4 / 5;
    background:#ebe2d7;
    overflow:hidden;
}

.foto > img,
.carrusel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Si tiene fotos, se pueden abrir en grande */
.foto.conFotos{ cursor:zoom-in; }

.sinFoto{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.sinFoto img{
    width:34%;
    border-radius:50%;
    opacity:.22;
    filter:grayscale(1);
}

.agotado{
    position:absolute;
    top:14px;
    left:14px;
    background:var(--papel);
    color:var(--tinta);
    font-size:11px;
    font-weight:500;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:6px 12px;
}

/* Varias fotos: se deslizan; en computadora hay flechas */

.carrusel{
    display:flex;
    width:100%;
    height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
}

.carrusel::-webkit-scrollbar{ display:none; }

.carrusel img{
    flex:0 0 100%;
    scroll-snap-align:center;
}

.flecha{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(246,241,234,.92);
    color:var(--tinta);
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .16s var(--ease-out);
}

.flecha svg,
.flechaVisor svg,
.cerrarVisor svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.75;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.flecha:hover{ background:white; }

.flecha:active{ transform:translateY(-50%) scale(.94); }

.flecha.izq{ left:10px; }
.flecha.der{ right:10px; }

@media (hover:hover){

    .visor:hover .flecha,
    .visor:focus-within .flecha{ display:flex; }

}

.puntos{
    position:absolute;
    left:0;
    right:0;
    bottom:12px;
    display:flex;
    justify-content:center;
    gap:6px;
    pointer-events:none;
}

.puntos span{
    width:18px;
    height:2px;
    background:rgba(255,255,255,.55);
    transition:background .2s;
}

.puntos span.activo{ background:white; }

.visor{
    position:relative;
    width:100%;
    height:100%;
}

.datos{
    padding-top:18px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.textos{
    margin-bottom:18px;
}

.datos h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:25px;
    line-height:1.15;
    overflow-wrap:anywhere;
}

.incluye{
    margin-top:6px;
    font-size:14px;
    font-weight:500;
    color:var(--acento);
    overflow-wrap:anywhere;
}

.descripcion{
    margin-top:8px;
    font-size:15px;
    color:var(--tinta-suave);
    overflow-wrap:anywhere;
}

.pie{
    margin-top:auto;
    padding-top:16px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    border-top:1px solid var(--linea);
}

.precio{
    font-family:var(--serif);
    font-weight:600;
    font-size:25px;
    font-variant-numeric:lining-nums tabular-nums;
    color:var(--acento);
    white-space:nowrap;
}

.consultar{
    display:inline-block;
    font-size:12px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--tinta);
    text-decoration:none;
    border-bottom:1px solid var(--tinta);
    padding-bottom:2px;
    white-space:nowrap;
    transition:color .15s, border-color .15s, transform .16s var(--ease-out);
}

.consultar:active{ transform:scale(.97); }

@media (hover:hover) and (pointer:fine){

    .consultar:hover{
        color:var(--acento);
        border-color:var(--acento);
    }

}

/* ---------- Foto en grande ---------- */

.visorGrande{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(20,15,12,.96);
    display:flex;
    flex-direction:column;
    opacity:0;
    transition:opacity .15s ease-out;
}

.visorGrande[hidden]{ display:none; }

.visorGrande.abierto{
    opacity:1;
    transition:opacity .2s var(--ease-out);
}

.tiraVisor{
    flex:1;
    min-height:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    transform:scale(.97);
    transition:transform .15s ease-out;
}

.visorGrande.abierto .tiraVisor{
    transform:scale(1);
    transition:transform .2s var(--ease-out);
}

.tiraVisor::-webkit-scrollbar{ display:none; }

.tiraVisor img{
    flex:0 0 100%;
    width:100%;
    height:100%;
    object-fit:contain;
    scroll-snap-align:center;
    padding:64px 24px 8px;
}

.cerrarVisor,
.flechaVisor{
    position:absolute;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(246,241,234,.14);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .16s var(--ease-out);
}

.cerrarVisor{ top:14px; right:14px; z-index:2; }

.cerrarVisor:active{ transform:scale(.94); }

.flechaVisor{ top:50%; margin-top:-22px; z-index:2; }

.flechaVisor:active{ transform:scale(.94); }

.flechaVisor.izq{ left:18px; }
.flechaVisor.der{ right:18px; }

.flechaVisor[hidden]{ display:none; }

@media (hover:hover) and (pointer:fine){

    .cerrarVisor:hover,
    .flechaVisor:hover{ background:rgba(246,241,234,.28); }

}

@media (hover:none){

    /* En el celular se desliza con el dedo */
    .flechaVisor{ display:none; }

}

.pieVisor{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:12px 24px 22px;
    color:#e9ded3;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.pieVisor span:first-child{
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:none;
}

body.sinScroll{ overflow:hidden; }

@media (prefers-reduced-motion:reduce){

    .visorGrande,
    .visorGrande.abierto,
    .tiraVisor,
    .visorGrande.abierto .tiraVisor{ transition:opacity .15s linear; transform:none; }

}

/* ---------- Estados ---------- */

.mensaje{
    grid-column:1 / -1;
    text-align:center;
    padding:70px 16px;
    font-family:var(--serif);
    font-style:italic;
    font-size:24px;
    color:var(--tinta-suave);
}

.esqueleto{
    aspect-ratio:4 / 5;
    background:linear-gradient(90deg, #ece3d8 25%, #f3ece3 50%, #ece3d8 75%);
    background-size:200% 100%;
    animation:brillo 1.3s infinite;
}

@keyframes brillo{
    from{ background-position:200% 0; }
    to{ background-position:-200% 0; }
}

/* ---------- Cierre ---------- */

footer{
    margin-top:80px;
    background:var(--acento);
    color:#f3e7de;
    text-align:center;
    padding:48px 20px 52px;
}

footer .marca{
    font-family:var(--serif);
    font-size:28px;
    font-weight:600;
    letter-spacing:.04em;
}

footer p{
    margin-top:10px;
    font-size:14px;
    letter-spacing:.06em;
}

footer a{
    color:white;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,.5);
    padding-bottom:1px;
}

/* ---------- Pantallas más chicas ---------- */

@media (max-width:900px){

    .grilla{ grid-template-columns:repeat(2, 1fr); gap:44px 22px; }

}

@media (max-width:560px){

    header{ padding:40px 16px 30px; }

    header h1{ font-size:32px; }

    .subtitulo{ letter-spacing:.26em; }

    .categorias{ justify-content:flex-start; gap:26px; padding:0 16px; }

    main{ padding:0 16px 8px; }

    .seccion{ padding-top:48px; }

    .encabezadoSeccion h2{ font-size:36px; }

    .grilla{ gap:36px 14px; margin-top:26px; }

    .datos{ padding-top:12px; }

    .datos h3{ font-size:20px; }

    .descripcion{ font-size:13.5px; }

    .pie{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }

    .precio{ font-size:22px; }

    .agotado{ top:10px; left:10px; }

}

</style>

</head>

<body>

<header>

    <img
        class="logo"
        src="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg"
        alt="Tomate un Mate">

    <h1>Tomate un Mate</h1>

    <p class="subtitulo">Catálogo</p>

</header>

<div class="barraCategorias">

    <nav class="categorias" id="categorias" aria-label="Categorías"></nav>

</div>

<main>

    <div id="contenido">

        <div class="grilla">

            <div class="esqueleto"></div>
            <div class="esqueleto"></div>
            <div class="esqueleto"></div>

        </div>

    </div>

</main>

<footer id="cierre"></footer>

<!-- Foto en grande -->

<div class="visorGrande" id="visorGrande" role="dialog" aria-modal="true" aria-label="Fotos del producto" hidden>

    <button class="cerrarVisor" id="cerrarVisor" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="tiraVisor" id="tiraVisor"></div>

    <button class="flechaVisor izq" id="visorAnterior" data-dir="-1" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <button class="flechaVisor der" id="visorSiguiente" data-dir="1" aria-label="Foto siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <div class="pieVisor">
        <span id="tituloVisor"></span>
        <span id="contadorVisor"></span>
    </div>

</div>

<script>

// Dirección de la app (Apps Script). Siempre lee lo último que
// se cargó desde la solapa "Catálogo" de la app de gestión.
const API_CATALOGO =
    "https://script.google.com/macros/s/AKfycbxmlAU6gnhv9OT0P8Xs5V1XuFhMZToWnwJbz6gMi0diUCuqqUqiPBI65VmVbFn7PcBQ/exec?catalogo";

const LOGO = "https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg";

let catalogo = { telefono: "", instagram: "", productos: [] };
let categoriaActiva = "Todos";

function esc(texto){

    return String(texto ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");

}

// "TORPEDO CINCELADO - calabaza" -> "Torpedo Cincelado - calabaza".
// Pasa a minúscula las palabras escritas TODO en mayúscula (más de
// 3 letras), así no quedan gritando; las siglas cortas se respetan.
function normalizarTexto(texto){

    return String(texto || "")
        .split(" ")
        .map(palabra => {

            const letras = palabra.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g, "");

            if(letras.length > 3 && letras === letras.toUpperCase()){

                return palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();

            }

            return palabra;

        })
        .join(" ");

}

function formatearPrecio(valor){

    return "$" + Number(valor).toLocaleString("es-AR");

}

// Deja solo los números y le antepone el código de Argentina
// si no lo tiene (para que el link de WhatsApp funcione).
function numeroWhatsapp(telefono){

    let numero = String(telefono || "").replace(/\D/g, "").replace(/^0+/, "");

    if(!numero) return "";

    if(!numero.startsWith("54")){
        numero = "54" + numero;
    }

    return numero;

}

function linkWhatsapp(producto){

    const numero = numeroWhatsapp(catalogo.telefono);

    if(!numero) return "";

    const nombre = normalizarTexto(producto.titulo);

    let mensaje = producto.disponible
        ? `Hola! Me interesa "${nombre}" que vi en el catálogo. ¿Está disponible?`
        : `Hola! Vi "${nombre}" en el catálogo y quería consultar si lo van a tener de nuevo.`;

    // WhatsApp no permite ocultar un link detrás de un texto ni adjuntar
    // una imagen desde la página, así que el mensaje lleva un link CORTO
    // al producto: al abrirlo, el catálogo muestra su foto en grande.
    if(producto.fotos && producto.fotos.length){

        const base = location.href.split(/[?#]/)[0];

        mensaje += "\n" + base + "?p=" + encodeURIComponent(producto.id);

    }

    return "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

}

function nombreCategoria(producto){

    return normalizarTexto(producto.categoria) || "Otros";

}

function categoriasDisponibles(){

    return [...new Set(catalogo.productos.map(nombreCategoria))];

}

function dibujarCategorias(){

    const contenedor = document.getElementById("categorias");

    const nombres = categoriasDisponibles();

    // Sin productos no hay nada que filtrar
    if(!nombres.length){

        contenedor.innerHTML = "";

        return;

    }

    const enlace = (nombre, cantidad) => `

        <button
            class="enlaceCategoria ${nombre === categoriaActiva ? "activo" : ""}"
            data-categoria="${esc(nombre)}">
            ${esc(nombre)}<sup>${cantidad}</sup>
        </button>

    `;

    contenedor.innerHTML =

        enlace("Todos", catalogo.productos.length)

        + nombres.map(nombre =>

            enlace(nombre, catalogo.productos.filter(p => nombreCategoria(p) === nombre).length)

        ).join("");

}

function crearFotos(producto){

    const fotos = producto.fotos || [];

    const titulo = esc(normalizarTexto(producto.titulo));

    const imagen = (url, i = 0) => `<img data-i="${i}" src="${esc(url)}" alt="${titulo}" loading="lazy" onerror="this.remove()">`;

    if(!fotos.length){

        return `<div class="sinFoto"><img src="${LOGO}" alt=""></div>`;

    }

    if(fotos.length === 1){

        return imagen(fotos[0]);

    }

    return `

        <div class="visor">

            <div class="carrusel">${fotos.map(imagen).join("")}</div>

            <button class="flecha izq" data-dir="-1" aria-label="Foto anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>

            <button class="flecha der" data-dir="1" aria-label="Foto siguiente">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>

            <div class="puntos">

                ${fotos.map((_, i) => `<span class="${i === 0 ? "activo" : ""}"></span>`).join("")}

            </div>

        </div>

    `;

}

function crearPieza(producto){

    const link = linkWhatsapp(producto);

    return `

    <article class="pieza" data-id="${esc(producto.id)}">

        <div class="foto ${producto.fotos && producto.fotos.length ? "conFotos" : ""}">

            ${crearFotos(producto)}

            ${producto.disponible ? "" : `<span class="agotado">Agotado</span>`}

        </div>

        <div class="datos">

            <div class="textos">

                <h3>${esc(normalizarTexto(producto.titulo))}</h3>

                ${producto.incluye
                    ? `<p class="incluye">${esc(normalizarTexto(producto.incluye))}</p>`
                    : ""
                }

                ${producto.descripcion
                    ? `<p class="descripcion">${esc(producto.descripcion)}</p>`
                    : ""
                }

            </div>

            <div class="pie">

                <span class="precio">${formatearPrecio(producto.precio)}</span>

                ${link ? `

                <a class="consultar" href="${link}" target="_blank" rel="noopener">
                    ${producto.disponible ? "Pedir por WhatsApp" : "Consultar"}
                </a>

                ` : ""}

            </div>

        </div>

    </article>

    `;

}

function dibujarProductos(){

    const contenido = document.getElementById("contenido");

    if(!catalogo.productos.length){

        contenido.innerHTML = `<div class="grilla"><div class="mensaje">Muy pronto vas a encontrar acá nuestros productos.</div></div>`;

        return;

    }

    // "Todos" muestra una sección por categoría; si se elige una,
    // se ve solo esa.
    const nombres = categoriasDisponibles().filter(nombre =>
        categoriaActiva === "Todos" || nombre === categoriaActiva
    );

    contenido.innerHTML = nombres.map(nombre => {

        const productos = catalogo.productos.filter(p => nombreCategoria(p) === nombre);

        return `

        <section class="seccion">

            <div class="encabezadoSeccion">

                <h2>${esc(nombre)}</h2>

                <span class="regla"></span>

                <small>${productos.length} ${productos.length === 1 ? "pieza" : "piezas"}</small>

            </div>

            <div class="grilla">

                ${productos.map(crearPieza).join("")}

            </div>

        </section>

        `;

    }).join("");

}

function dibujarCierre(){

    const instagram = String(catalogo.instagram || "").trim().replace(/^@/, "");

    document.getElementById("cierre").innerHTML = `

        <div class="marca">Tomate un Mate</div>

        ${instagram
            ? `<p>Seguinos en <a href="https://instagram.com/${encodeURIComponent(instagram)}" target="_blank" rel="noopener">@${esc(instagram)}</a></p>`
            : ""
        }

    `;

}

// ---------- Interacciones ----------

document.getElementById("categorias").addEventListener("click", evento => {

    const boton = evento.target.closest(".enlaceCategoria");

    if(!boton) return;

    categoriaActiva = boton.dataset.categoria;

    dibujarCategorias();

    dibujarProductos();

    document.getElementById("contenido").scrollIntoView({ behavior: "smooth" });

});

// Flechas del carrusel de fotos (para computadora, donde no se desliza con el dedo)
document.getElementById("contenido").addEventListener("click", evento => {

    const flecha = evento.target.closest(".flecha");

    if(!flecha) return;

    const carrusel = flecha.closest(".visor").querySelector(".carrusel");

    carrusel.scrollBy({
        left: Number(flecha.dataset.dir) * carrusel.clientWidth,
        behavior: "smooth"
    });

});

// Los puntitos siguen a la foto que se está viendo
document.getElementById("contenido").addEventListener("scroll", evento => {

    const carrusel = evento.target;

    if(!carrusel.classList || !carrusel.classList.contains("carrusel")) return;

    const actual = Math.round(carrusel.scrollLeft / carrusel.clientWidth);

    carrusel.parentElement
        .querySelectorAll(".puntos span")
        .forEach((punto, i) => punto.classList.toggle("activo", i === actual));

}, true);

// ---------- Foto en grande ----------
// Al tocar una foto se abre a pantalla completa. Con varias fotos
// se pasan con las flechas, el teclado (← →) o deslizando.

const visor = document.getElementById("visorGrande");
const tiraVisor = document.getElementById("tiraVisor");

let elementoQueAbrio = null;
let temporizadorVisor = null;

function actualizarContadorVisor(){

    const total = tiraVisor.children.length;

    const actual = Math.round(tiraVisor.scrollLeft / (tiraVisor.clientWidth || 1)) + 1;

    document.getElementById("contadorVisor").textContent =
        total > 1 ? actual + " / " + total : "";

}

function abrirVisor(producto, indice){

    clearTimeout(temporizadorVisor);

    tiraVisor.innerHTML = producto.fotos
        .map(url => `<img src="${esc(url)}" alt="${esc(normalizarTexto(producto.titulo))}">`)
        .join("");

    document.getElementById("tituloVisor").textContent = normalizarTexto(producto.titulo);

    const hayVarias = producto.fotos.length > 1;

    document.getElementById("visorAnterior").hidden = !hayVarias;
    document.getElementById("visorSiguiente").hidden = !hayVarias;

    elementoQueAbrio = document.activeElement;

    visor.hidden = false;

    document.body.classList.add("sinScroll");

    // Se posiciona en la foto tocada sin animación
    tiraVisor.style.scrollSnapType = "none";
    tiraVisor.scrollLeft = indice * tiraVisor.clientWidth;

    // Se vuelve a fijar en el cuadro siguiente por si el navegador
    // todavía no había terminado de medir las fotos.
    requestAnimationFrame(() => {

        tiraVisor.scrollLeft = indice * tiraVisor.clientWidth;

        tiraVisor.style.scrollSnapType = "";

        actualizarContadorVisor();

    });

    actualizarContadorVisor();

    // Fuerza el cálculo de estilos para que la entrada se anime
    void visor.offsetWidth;

    visor.classList.add("abierto");

    document.getElementById("cerrarVisor").focus();

}

function cerrarVisor(){

    if(visor.hidden) return;

    visor.classList.remove("abierto");

    document.body.classList.remove("sinScroll");

    // La salida es más corta que la entrada (150 ms)
    temporizadorVisor = setTimeout(() => {

        visor.hidden = true;

        tiraVisor.innerHTML = "";

    }, 150);

    if(elementoQueAbrio && elementoQueAbrio.focus){
        elementoQueAbrio.focus();
    }

}

function moverVisor(direccion, animado){

    tiraVisor.scrollBy({
        left: direccion * tiraVisor.clientWidth,
        behavior: animado ? "smooth" : "auto"
    });

}

document.getElementById("contenido").addEventListener("click", evento => {

    const foto = evento.target.closest(".foto.conFotos");

    if(!foto || evento.target.closest(".flecha")) return;

    const id = foto.closest(".pieza").dataset.id;

    const producto = catalogo.productos.find(p => String(p.id) === id);

    if(!producto) return;

    const imagen = evento.target.closest("img");

    const indice = imagen ? Number(imagen.dataset.i) || 0 : 0;

    abrirVisor(producto, Math.min(indice, producto.fotos.length - 1));

});

document.getElementById("cerrarVisor").addEventListener("click", cerrarVisor);

// Click en el fondo oscuro (no sobre la foto ni los botones) cierra
visor.addEventListener("click", evento => {

    if(evento.target === visor || evento.target.closest(".pieVisor")){
        cerrarVisor();
    }

});

visor.addEventListener("click", evento => {

    const flecha = evento.target.closest(".flechaVisor");

    if(flecha){
        moverVisor(Number(flecha.dataset.dir), true);
    }

});

tiraVisor.addEventListener("scroll", actualizarContadorVisor, { passive: true });

document.addEventListener("keydown", evento => {

    if(visor.hidden) return;

    if(evento.key === "Escape"){
        cerrarVisor();
        return;
    }

    // Con el teclado el cambio es instantáneo, sin animación
    if(evento.key === "ArrowRight"){ moverVisor(1, false); }

    if(evento.key === "ArrowLeft"){ moverVisor(-1, false); }

    // El foco no se escapa a la página de atrás
    if(evento.key === "Tab"){

        const botones = [...visor.querySelectorAll("button")].filter(b => !b.hidden && b.offsetParent !== null);

        if(!botones.length) return;

        const primero = botones[0];
        const ultimo = botones[botones.length - 1];

        if(evento.shiftKey && document.activeElement === primero){
            evento.preventDefault();
            ultimo.focus();
        }else if(!evento.shiftKey && document.activeElement === ultimo){
            evento.preventDefault();
            primero.focus();
        }

    }

});

// Si el link trae "?p=15", se abre directo ese producto: con fotos,
// la primera en grande; sin fotos, se lo deja a la vista.
function abrirProductoDelLink(){

    const id = new URLSearchParams(location.search).get("p");

    if(!id) return;

    const producto = catalogo.productos.find(p => String(p.id) === id);

    if(!producto) return;

    if(producto.fotos && producto.fotos.length){

        abrirVisor(producto, 0);

        return;

    }

    const pieza = document.querySelector('.pieza[data-id="' + CSS.escape(String(producto.id)) + '"]');

    if(pieza) pieza.scrollIntoView({ block: "center" });

}

fetch(API_CATALOGO)

    .then(respuesta => respuesta.json())

    .then(datos => {

        if(datos.error) throw new Error(datos.error);

        catalogo = datos;

        dibujarCategorias();

        dibujarProductos();

        dibujarCierre();

        abrirProductoDelLink();

    })

    .catch(() => {

        document.getElementById("contenido").innerHTML =
            `<div class="grilla"><div class="mensaje">No pudimos cargar el catálogo. Probá de nuevo en unos minutos.</div></div>`;

    });

</script>
