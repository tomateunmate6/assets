<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tomate un Mate · Catálogo</title>
<meta name="description" content="Catálogo de mates, bombillas y accesorios de Tomate un Mate.">
<meta name="theme-color" content="#f6f1ea">

<!-- Cómo se ve el link cuando se comparte por WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:title" content="Tomate un Mate · Catálogo">
<meta property="og:description" content="Mates, bombillas y accesorios.">
<meta property="og:image" content="https://tomateunmate6.github.io/assets/catalogo/icono.png">

<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="icono.png">

<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
    color-scheme:light;
    --papel:#f6f1ea;
    --tinta:#2b211c;
    --tinta-suave:#6a5e55;
    --linea:#ddd2c6;
    --acento:#6e3826;
    --acento-oscuro:#4d2518;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);

    /* Formas suaves, las mismas en todo el catálogo */
    --radio-medio:14px;      /* fotos, botones */
    --radio-tarjeta:18px;    /* tarjetas de promo */
    --radio-interno:12px;    /* lo que va dentro de una tarjeta */

    /* Una sola sombra, teñida con el marrón de la marca */
    --sombra-tarjeta:0 14px 30px -16px rgba(110,56,38,.34), 0 2px 6px rgba(43,33,28,.06);
    --sombra-tarjeta-alta:0 22px 40px -18px rgba(110,56,38,.42), 0 3px 8px rgba(43,33,28,.08);
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Jost', system-ui, -apple-system, sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
    font-family:var(--sans);
    background:var(--papel);
    color:var(--tinta);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
}

/* Lo que el navegador dibuja por su cuenta, con los colores de la marca */

::selection{
    background:var(--acento);
    color:white;
}

:focus-visible{
    outline:2px solid var(--acento);
    outline-offset:3px;
}

button{ font-family:inherit; }

/* ---------- Portada ---------- */

header{
    text-align:center;
    padding:56px 20px 40px;
}

.logo{
    display:block;
    width:min(250px, 66vw);
    height:auto;
    margin:0 auto;
}

/* El nombre ya está en el logo: el título queda solo para lectores de pantalla */
header h1{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
}

.subtitulo{
    margin-top:18px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--tinta-suave);
}

/* ---------- Navegación por categoría ---------- */

.barraCategorias{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(246,241,234,.94);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    border-top:1px solid var(--linea);
    border-bottom:1px solid var(--linea);
}

.categorias{
    display:flex;
    justify-content:center;
    gap:34px;
    max-width:1180px;
    margin:0 auto;
    padding:0 20px;
    overflow-x:auto;
    scrollbar-width:none;
}

.categorias::-webkit-scrollbar{ display:none; }

.categorias:empty{ display:none; }

.enlaceCategoria{
    flex-shrink:0;
    white-space:nowrap;
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:16px 2px 14px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--tinta-suave);
    cursor:pointer;
    transition:color .2s, border-color .2s;
}

@media (hover:hover) and (pointer:fine){

    .enlaceCategoria:hover{ color:var(--acento); }

}

.enlaceCategoria.activo{
    color:var(--acento);
    border-bottom-color:var(--acento);
}

.enlaceCategoria sup{
    font-size:10px;
    margin-left:3px;
    letter-spacing:0;
}

/* ---------- Secciones ---------- */

main{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px 24px;
}

#contenido{ scroll-margin-top:64px; }

.seccion{ padding-top:64px; }

.encabezadoSeccion{
    display:flex;
    align-items:baseline;
    gap:20px;
}

.encabezadoSeccion h2{
    font-family:var(--serif);
    font-weight:500;
    font-style:italic;
    font-size:44px;
    line-height:1;
    color:var(--tinta);
}

.encabezadoSeccion .regla{
    flex:1;
    height:1px;
    background:var(--linea);
    transform:translateY(-6px);
}

.encabezadoSeccion small{
    font-size:12px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--tinta-suave);
}

.grilla{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:56px 36px;
    margin-top:36px;
}

/* ---------- Producto ---------- */

.pieza{
    display:flex;
    flex-direction:column;
}

.foto{
    position:relative;
    aspect-ratio:4 / 5;
    background:#ebe2d7;
    overflow:hidden;
    isolation:isolate;
    border-radius:var(--radio-medio);
}

.foto > img,
.carrusel img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Si tiene fotos, se pueden abrir en grande */
.foto.conFotos{ cursor:zoom-in; }

.foto > img,
.carrusel img{
    transition:transform .4s var(--ease-out);
}

@media (hover:hover) and (pointer:fine){

    .foto.conFotos:hover > img,
    .foto.conFotos:hover .carrusel img{ transform:scale(1.035); }

}

.sinFoto{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.sinFoto img{
    width:56%;
    opacity:.22;
}

.agotado{
    position:absolute;
    top:12px;
    left:12px;
    z-index:2;
    background:var(--tinta);
    color:white;
    font-size:13px;
    font-weight:500;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:999px;
    box-shadow:0 4px 12px rgba(43,33,28,.35);
}

/* Sin stock: la foto se apaga un poco y el precio queda en gris */
.sinStock .foto > img,
.sinStock .carrusel img,
.sinStock .sinFoto{
    opacity:.55;
    filter:grayscale(.55);
}

.sinStock .precio{ color:var(--tinta-suave); }

/* Varias fotos: se deslizan; en computadora hay flechas */

.carrusel{
    display:flex;
    width:100%;
    height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
}

.carrusel::-webkit-scrollbar{ display:none; }

.carrusel img{
    flex:0 0 100%;
    scroll-snap-align:center;
}

.flecha{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:rgba(246,241,234,.92);
    color:var(--tinta);
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .16s var(--ease-out);
}

.flecha svg,
.flechaVisor svg,
.cerrarVisor svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.75;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.flecha:hover{ background:white; }

.flecha:active{ transform:translateY(-50%) scale(.94); }

.flecha.izq{ left:10px; }
.flecha.der{ right:10px; }

@media (hover:hover){

    .visor:hover .flecha,
    .visor:focus-within .flecha{ display:flex; }

}

.puntos{
    position:absolute;
    left:0;
    right:0;
    bottom:12px;
    display:flex;
    justify-content:center;
    gap:6px;
    pointer-events:none;
}

.puntos span{
    width:18px;
    height:2px;
    background:rgba(255,255,255,.55);
    transition:background .2s;
}

.puntos span.activo{ background:white; }

.visor{
    position:relative;
    width:100%;
    height:100%;
}

.datos{
    padding-top:18px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.textos{
    margin-bottom:18px;
}

.datos h3,
.datosFila h3,
.encabezadoSeccion h2{ text-wrap:balance; }

.descripcion{ text-wrap:pretty; }

.datos h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:25px;
    line-height:1.15;
    overflow-wrap:anywhere;
}

.incluye{
    margin-top:6px;
    font-size:14px;
    font-weight:500;
    color:var(--acento);
    overflow-wrap:anywhere;
}

.descripcion{
    margin-top:8px;
    font-size:15px;
    color:var(--tinta-suave);
    overflow-wrap:anywhere;
}

.pie{
    margin-top:auto;
    padding-top:14px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    border-top:1px solid var(--linea);
}

.precio{
    font-family:var(--serif);
    font-weight:600;
    font-size:25px;
    font-variant-numeric:lining-nums tabular-nums;
    color:var(--acento);
    white-space:nowrap;
}

.pedir{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--acento);
    color:white;
    border:1.5px solid var(--acento);
    border-radius:var(--radio-medio);
    padding:13px 14px;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-decoration:none;
    text-align:center;
    transition:background .15s, color .15s, transform .16s var(--ease-out);
}

.pedir svg,
.btnPromo svg{
    width:18px;
    height:18px;
    flex-shrink:0;
    fill:currentColor;
}

.pedir:active{ transform:scale(.97); }

/* Sin stock: botón vacío (se consulta, no se pide) */
.pedir.consultar{
    background:transparent;
    color:var(--acento);
}

@media (hover:hover) and (pointer:fine){

    .pedir:hover{
        background:var(--acento-oscuro);
        border-color:var(--acento-oscuro);
        color:white;
    }

}

/* ---------- Foto en grande ---------- */

.visorGrande{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(20,15,12,.96);
    display:flex;
    flex-direction:column;
    opacity:0;
    transition:opacity .15s ease-out;
}

.visorGrande[hidden]{ display:none; }

.visorGrande.abierto{
    opacity:1;
    transition:opacity .2s var(--ease-out);
}

.tiraVisor{
    flex:1;
    min-height:0;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    transform:scale(.97);
    transition:transform .15s ease-out;
}

.visorGrande.abierto .tiraVisor{
    transform:scale(1);
    transition:transform .2s var(--ease-out);
}

.tiraVisor::-webkit-scrollbar{ display:none; }

.tiraVisor img{
    flex:0 0 100%;
    width:100%;
    height:100%;
    object-fit:contain;
    scroll-snap-align:center;
    padding:64px 24px 8px;
}

.cerrarVisor,
.flechaVisor{
    position:absolute;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(246,241,234,.14);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s, transform .16s var(--ease-out);
}

.cerrarVisor{ top:14px; right:14px; z-index:2; }

.cerrarVisor:active{ transform:scale(.94); }

.flechaVisor{ top:50%; margin-top:-22px; z-index:2; }

.flechaVisor:active{ transform:scale(.94); }

.flechaVisor.izq{ left:18px; }
.flechaVisor.der{ right:18px; }

.flechaVisor[hidden]{ display:none; }

@media (hover:hover) and (pointer:fine){

    .cerrarVisor:hover,
    .flechaVisor:hover{ background:rgba(246,241,234,.28); }

}

@media (hover:none){

    /* En el celular se desliza con el dedo */
    .flechaVisor{ display:none; }

}

.pieVisor{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:12px 24px 22px;
    color:#e9ded3;
    font-size:13px;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.pieVisor span:first-child{
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:none;
}

body.sinScroll{ overflow:hidden; }

@media (prefers-reduced-motion:reduce){

    .filaPromo,
    .foto > img,
    .carrusel img{ transition:none; }

    .filaPromo:hover{ transform:none; }

    .foto.conFotos:hover > img,
    .foto.conFotos:hover .carrusel img{ transform:none; }

    .visorGrande,
    .visorGrande.abierto,
    .tiraVisor,
    .visorGrande.abierto .tiraVisor{ transition:opacity .15s linear; transform:none; }

}

/* ---------- Estados ---------- */

.mensaje{
    grid-column:1 / -1;
    text-align:center;
    padding:70px 16px;
    font-family:var(--serif);
    font-style:italic;
    font-size:24px;
    color:var(--tinta-suave);
}

.esqueleto{
    aspect-ratio:4 / 5;
    background:linear-gradient(90deg, #ece3d8 25%, #f3ece3 50%, #ece3d8 75%);
    background-size:200% 100%;
    animation:brillo 1.3s infinite;
}

@keyframes brillo{
    from{ background-position:200% 0; }
    to{ background-position:-200% 0; }
}

/* ---------- Grabados personalizados ---------- */

.avisoGrabados{
    display:flex;
    align-items:center;
    gap:14px;
    width:min(100%, 620px);
    margin:24px auto 0;
    padding:14px 18px;
    background:var(--acento);
    color:white;
    text-align:left;
    text-decoration:none;
    border-radius:var(--radio-tarjeta);
    box-shadow:0 14px 28px -14px rgba(110,56,38,.6), 0 2px 6px rgba(43,33,28,.1);
    transition:background .15s, transform .16s var(--ease-out);
}

.avisoGrabados:active{ transform:scale(.98); }

@media (hover:hover) and (pointer:fine){

    .avisoGrabados:hover{ background:var(--acento-oscuro); }

}

.avisoGrabados .estrella{
    width:30px;
    height:30px;
    flex-shrink:0;
    fill:#f3e7de;
}

.avisoGrabados .textoAviso{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
}

.avisoGrabados strong{
    font-family:var(--serif);
    font-weight:600;
    font-size:23px;
    line-height:1.1;
    letter-spacing:.01em;
}

.avisoGrabados small{
    font-size:13.5px;
    color:#f3e7de;
    letter-spacing:.02em;
}

.avisoGrabados .flechaAviso{
    width:22px;
    height:22px;
    flex-shrink:0;
    fill:none;
    stroke:white;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.avisoGrabados:empty{ display:none; }

.bloqueGrabados{
    max-width:1180px;
    margin:64px auto 0;
    padding:0 20px;
    scroll-margin-top:70px;
}

.bloqueGrabados:empty{ display:none; }

.tarjetaGrabados{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:20px 30px;
    padding:28px 32px;
    background:linear-gradient(100deg, #fffdfb 0%, #fffdfb 58%, #faeee4 100%);
    border-radius:var(--radio-tarjeta);
    box-shadow:var(--sombra-tarjeta);
}

.anilloGrabados{
    width:86px;
    height:86px;
    flex-shrink:0;
}

.tarjetaGrabados h2{
    font-family:var(--serif);
    font-weight:600;
    font-size:34px;
    line-height:1.1;
    color:var(--tinta);
}

.tarjetaGrabados p{
    margin-top:8px;
    font-size:15.5px;
    color:var(--tinta-suave);
    max-width:56ch;
    text-wrap:pretty;
}

.tarjetaGrabados .pedir{
    padding:15px 26px;
    white-space:nowrap;
}

@media (max-width:900px){

    .tarjetaGrabados{
        grid-template-columns:auto 1fr;
        padding:22px 22px;
    }

    .tarjetaGrabados .pedir{
        grid-column:1 / -1;
    }

}

@media (max-width:560px){

    .bloqueGrabados{ margin-top:48px; padding:0 16px; }

    .avisoGrabados{ margin-top:20px; padding:12px 14px; gap:12px; }

    .avisoGrabados .estrella{ width:26px; height:26px; }

    .avisoGrabados strong{ font-size:20px; }

    .avisoGrabados small{ font-size:12.5px; }

    .tarjetaGrabados{
        grid-template-columns:1fr;
        justify-items:start;
        gap:14px;
        padding:20px 18px;
    }

    .anilloGrabados{ width:64px; height:64px; }

    .tarjetaGrabados h2{ font-size:28px; }

    .tarjetaGrabados p{ font-size:14.5px; }

    .tarjetaGrabados .pedir{
        width:100%;
        white-space:normal;
        padding:13px 10px;
    }

}

/* ---------- Cierre ---------- */

footer{
    margin-top:80px;
    border-radius:26px 26px 0 0;
    background:var(--acento);
    color:#f3e7de;
    text-align:center;
    padding:48px 20px 52px;
}

footer .logoCierre{
    height:96px;
    width:auto;
    display:block;
    margin:0 auto;
}

footer p{
    margin-top:10px;
    font-size:14px;
    letter-spacing:.06em;
}

footer a{
    color:white;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,.5);
    padding-bottom:1px;
}

/* ---------- Promos: tarjetas redondeadas, una por fila ---------- */
/* Se destacan por la sombra, el tamaño del precio y el botón lleno; la
   forma (radios, tipografía, fotos) es la misma que la del resto. */

.panelPromos{
    display:grid;
    gap:18px;
    margin-top:30px;
}

.filaPromo{
    display:grid;
    grid-template-columns:176px 1fr auto;
    gap:16px 32px;
    align-items:center;
    padding:20px 28px 20px 20px;
    background:linear-gradient(100deg, #fffdfb 0%, #fffdfb 58%, #faeee4 100%);
    border-radius:var(--radio-tarjeta);
    box-shadow:var(--sombra-tarjeta);
    transition:transform .2s var(--ease-out), box-shadow .2s var(--ease-out);
}

.filaPromo .foto{
    aspect-ratio:1 / 1;
    border-radius:var(--radio-interno);
}

.datosFila h3{
    font-family:var(--serif);
    font-weight:600;
    font-size:31px;
    line-height:1.12;
    overflow-wrap:anywhere;
}

.datosFila .incluye{ font-size:15px; }

.datosFila .descripcion{ margin-top:8px; }

.compraFila{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:14px;
}

.filaPromo .precio{
    font-size:38px;
    line-height:1;
}

.btnPromo{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--acento);
    color:white;
    border:1.5px solid var(--acento);
    border-radius:var(--radio-medio);
    padding:14px 26px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.14em;
    text-transform:uppercase;
    text-decoration:none;
    white-space:nowrap;
    transition:background .15s, color .15s, transform .16s var(--ease-out);
}

.btnPromo:active{ transform:scale(.97); }

/* Sin stock: botón vacío (se consulta, no se pide) */
.btnPromo.consultar{
    background:transparent;
    color:var(--acento);
}

@media (hover:hover) and (pointer:fine){

    .filaPromo:hover{
        transform:translateY(-2px);
        box-shadow:var(--sombra-tarjeta-alta);
    }

    .btnPromo:hover{
        background:var(--acento-oscuro);
        border-color:var(--acento-oscuro);
        color:white;
    }

}

/* ---------- Pantallas más chicas ---------- */

@media (max-width:900px){

    .grilla{ grid-template-columns:repeat(2, 1fr); gap:44px 22px; }

    .filaPromo{
        grid-template-columns:132px 1fr auto;
        gap:14px 22px;
        padding:16px 22px 16px 16px;
    }

    .datosFila h3{ font-size:26px; }

    .filaPromo .precio{ font-size:32px; }

}

@media (max-width:560px){

    header{ padding:40px 16px 30px; }

    header h1{ font-size:32px; }

    .subtitulo{ letter-spacing:.26em; }

    .categorias{ justify-content:flex-start; gap:26px; padding:0 16px; }

    main{ padding:0 16px 8px; }

    .seccion{ padding-top:48px; }

    /* Promo en el celular: foto y texto arriba, precio y botón abajo */
    .filaPromo{
        grid-template-columns:96px 1fr;
        gap:14px 16px;
        padding:14px;
        align-items:start;
        background:linear-gradient(180deg, #fffdfb 0%, #fffdfb 55%, #faeee4 100%);
    }

}

</style>

</head>

<body>

<header>

    <img
        class="logo"
        src="logo-marron.png"
        alt="Tomate un Mate">

    <h1>Tomate un Mate</h1>

    <p class="subtitulo">Catálogo</p>

    <a class="avisoGrabados" id="avisoGrabados" href="#grabados"></a>

</header>

<div class="barraCategorias">

    <nav class="categorias" id="categorias" aria-label="Categorías"></nav>

</div>

<main>

    <div id="contenido">

        <div class="grilla">

            <div class="esqueleto"></div>
            <div class="esqueleto"></div>
            <div class="esqueleto"></div>

        </div>

    </div>

</main>

<section class="bloqueGrabados" id="grabados"></section>

<footer id="cierre"></footer>

<!-- Foto en grande -->

<div class="visorGrande" id="visorGrande" role="dialog" aria-modal="true" aria-label="Fotos del producto" hidden>

    <button class="cerrarVisor" id="cerrarVisor" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="tiraVisor" id="tiraVisor"></div>

    <button class="flechaVisor izq" id="visorAnterior" data-dir="-1" aria-label="Foto anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <button class="flechaVisor der" id="visorSiguiente" data-dir="1" aria-label="Foto siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <div class="pieVisor">
        <span id="tituloVisor"></span>
        <span id="contadorVisor"></span>
    </div>

</div>

<script>

// Dirección de la app (Apps Script). Siempre lee lo último que
// se cargó desde la solapa "Catálogo" de la app de gestión.
const API_CATALOGO =
    "https://script.google.com/macros/s/AKfycbxmlAU6gnhv9OT0P8Xs5V1XuFhMZToWnwJbz6gMi0diUCuqqUqiPBI65VmVbFn7PcBQ/exec?catalogo";

const LOGO = "logo-marron.png";

const ISOTIPO = "isotipo-claro.png";

let catalogo = { telefono: "", instagram: "", productos: [] };
let categoriaActiva = "Todos";

function esc(texto){

    return String(texto ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");

}

// "TORPEDO CINCELADO - calabaza" -> "Torpedo Cincelado - calabaza".
// Pasa a minúscula las palabras escritas TODO en mayúscula (más de
// 3 letras), así no quedan gritando; las siglas cortas se respetan.
function normalizarTexto(texto){

    return String(texto || "")
        .split(" ")
        .map(palabra => {

            const letras = palabra.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g, "");

            if(letras.length > 3 && letras === letras.toUpperCase()){

                return palabra.charAt(0).toUpperCase() + palabra.slice(1).toLowerCase();

            }

            return palabra;

        })
        .join(" ");

}

// Las fotos de Drive se pueden pedir en distintos tamaños. En las tarjetas
// alcanza con ~640 px (pesan mucho menos); al abrir una en grande se usa
// la original.
function tamano(url, ancho){

    return String(url).replace(/=w[0-9]+$/, "=w" + ancho);

}

function formatearPrecio(valor){

    return "$" + Number(valor).toLocaleString("es-AR");

}

// Deja solo los números y le antepone el código de Argentina
// si no lo tiene (para que el link de WhatsApp funcione).
function numeroWhatsapp(telefono){

    let numero = String(telefono || "").replace(/\D/g, "").replace(/^0+/, "");

    if(!numero) return "";

    if(!numero.startsWith("54")){
        numero = "54" + numero;
    }

    return numero;

}

function linkWhatsapp(producto){

    const numero = numeroWhatsapp(catalogo.telefono);

    if(!numero) return "";

    const nombre = normalizarTexto(producto.titulo);

    let mensaje = producto.disponible
        ? `Hola! Me interesa "${nombre}" que vi en el catálogo. ¿Está disponible?`
        : `Hola! Vi "${nombre}" en el catálogo y quería consultar si lo van a tener de nuevo.`;

    // WhatsApp no permite ocultar un link detrás de un texto ni adjuntar
    // una imagen desde la página, así que el mensaje lleva un link CORTO
    // al producto: al abrirlo, el catálogo muestra su foto en grande.
    if(producto.fotos && producto.fotos.length){

        const base = location.href.split(/[?#]/)[0];

        mensaje += "\n" + base + "?p=" + encodeURIComponent(producto.id);

    }

    return "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

}

function nombreCategoria(producto){

    return normalizarTexto(producto.categoria) || "Otros";

}

function categoriasDisponibles(){

    return [...new Set(catalogo.productos.map(nombreCategoria))];

}

function dibujarCategorias(){

    const contenedor = document.getElementById("categorias");

    const nombres = categoriasDisponibles();

    // Sin productos no hay nada que filtrar
    if(!nombres.length){

        contenedor.innerHTML = "";

        return;

    }

    const enlace = (nombre, cantidad) => `

        <button
            class="enlaceCategoria ${nombre === categoriaActiva ? "activo" : ""}"
            data-categoria="${esc(nombre)}">
            ${esc(nombre)}<sup>${cantidad}</sup>
        </button>

    `;

    contenedor.innerHTML =

        enlace("Todos", catalogo.productos.length)

        + nombres.map(nombre =>

            enlace(nombre, catalogo.productos.filter(p => nombreCategoria(p) === nombre).length)

        ).join("");

}

function crearFotos(producto){

    const fotos = producto.fotos || [];

    const titulo = esc(normalizarTexto(producto.titulo));

    const imagen = (url, i = 0) => `<img data-i="${i}" src="${esc(tamano(url, 640))}" decoding="async" alt="${titulo}" loading="lazy" onerror="this.remove()">`;

    if(!fotos.length){

        return `<div class="sinFoto"><img src="${LOGO}" alt=""></div>`;

    }

    if(fotos.length === 1){

        return imagen(fotos[0]);

    }

    return `

        <div class="visor">

            <div class="carrusel">${fotos.map(imagen).join("")}</div>

            <button class="flecha izq" data-dir="-1" aria-label="Foto anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>

            <button class="flecha der" data-dir="1" aria-label="Foto siguiente">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>

            <div class="puntos">

                ${fotos.map((_, i) => `<span class="${i === 0 ? "activo" : ""}"></span>`).join("")}

            </div>

        </div>

    `;

}

// Ícono de WhatsApp (SVG propio, hereda el color del botón)
const ICONO_WHATSAPP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';

function crearPieza(producto){

    const link = linkWhatsapp(producto);

    return `

    <article class="pieza ${producto.disponible ? "" : "sinStock"}" data-id="${esc(producto.id)}">

        <div class="foto ${producto.fotos && producto.fotos.length ? "conFotos" : ""}">

            ${crearFotos(producto)}

            ${producto.disponible ? "" : `<span class="agotado">Agotado</span>`}

        </div>

        <div class="datos">

            <div class="textos">

                <h3>${esc(normalizarTexto(producto.titulo))}</h3>

                ${producto.incluye
                    ? `<p class="incluye">${esc(normalizarTexto(producto.incluye))}</p>`
                    : ""
                }

                ${producto.descripcion
                    ? `<p class="descripcion">${esc(producto.descripcion)}</p>`
                    : ""
                }

            </div>

            <div class="pie">

                <span class="precio">${formatearPrecio(producto.precio)}</span>

                ${link ? `

                <a class="pedir ${producto.disponible ? "" : "consultar"}" href="${link}" target="_blank" rel="noopener">
                    ${ICONO_WHATSAPP}
                    ${producto.disponible ? "Pedir por WhatsApp" : "Consultar"}
                </a>

                ` : ""}

            </div>

        </div>

    </article>

    `;

}

// Una promo ocupa una fila entera: foto, de qué está hecha, precio y botón
function crearFilaPromo(producto){

    const link = linkWhatsapp(producto);

    return `

    <article class="pieza filaPromo ${producto.disponible ? "" : "sinStock"}" data-id="${esc(producto.id)}">

        <div class="foto ${producto.fotos && producto.fotos.length ? "conFotos" : ""}">

            ${crearFotos(producto)}

            ${producto.disponible ? "" : `<span class="agotado">Agotado</span>`}

        </div>

        <div class="datosFila">

            <h3>${esc(normalizarTexto(producto.titulo))}</h3>

            ${producto.incluye
                ? `<p class="incluye">${esc(normalizarTexto(producto.incluye))}</p>`
                : ""
            }

            ${producto.descripcion
                ? `<p class="descripcion">${esc(producto.descripcion)}</p>`
                : ""
            }

        </div>

        <div class="compraFila">

            <span class="precio">${formatearPrecio(producto.precio)}</span>

            ${link ? `

            <a class="btnPromo ${producto.disponible ? "" : "consultar"}" href="${link}" target="_blank" rel="noopener">
                ${ICONO_WHATSAPP}
                ${producto.disponible ? "Pedir por WhatsApp" : "Consultar"}
            </a>

            ` : ""}

        </div>

    </article>

    `;

}

function dibujarProductos(){

    const contenido = document.getElementById("contenido");

    if(!catalogo.productos.length){

        contenido.innerHTML = `<div class="grilla"><div class="mensaje">Muy pronto vas a encontrar acá nuestros productos.</div></div>`;

        return;

    }

    // "Todos" muestra una sección por categoría; si se elige una,
    // se ve solo esa.
    const nombres = categoriasDisponibles().filter(nombre =>
        categoriaActiva === "Todos" || nombre === categoriaActiva
    );

    contenido.innerHTML = nombres.map(nombre => {

        const productos = catalogo.productos.filter(p => nombreCategoria(p) === nombre);

        // Las promos (traen "incluye") se muestran resaltadas, una por fila;
        // el resto del catálogo sigue en grilla.
        const sonPromos = productos.every(p => p.incluye);

        return `

        <section class="seccion">

            <div class="encabezadoSeccion">

                <h2>${esc(nombre)}</h2>

                <span class="regla"></span>

                <small>${productos.length} ${productos.length === 1 ? (sonPromos ? "promo" : "pieza") : (sonPromos ? "promos" : "piezas")}</small>

            </div>

            ${sonPromos ? `

            <div class="panelPromos">

                ${productos.map(crearFilaPromo).join("")}

            </div>

            ` : `

            <div class="grilla">

                ${productos.map(crearPieza).join("")}

            </div>

            `}

        </section>

        `;

    }).join("");

}

// Franja de grabados personalizados: lleva a WhatsApp con el mensaje ya escrito
function linkWhatsappGrabados(){

    const numero = numeroWhatsapp(catalogo.telefono);

    if(!numero) return "";

    const mensaje = "Hola! Vi el catálogo y quería consultar por un grabado personalizado.";

    return "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

}

function dibujarGrabados(){

    const bloque = document.getElementById("grabados");

    const aviso = document.getElementById("avisoGrabados");

    const link = linkWhatsappGrabados();

    // Sin teléfono cargado no hay a dónde mandar la consulta: no se muestra nada
    if(!link){

        bloque.innerHTML = "";
        aviso.innerHTML = "";

        return;

    }

    aviso.innerHTML = `

        <svg class="estrella" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.7 5.2 3.3 8.3 10 10-6.7 1.7-9.3 4.8-10 10-.7-5.2-3.3-8.3-10-10 6.7-1.7 9.3-4.8 10-10Z"/></svg>

        <span class="textoAviso">
            <strong>Hacemos grabados personalizados</strong>
            <small>Tu nombre, una frase o un escudo en la virola del mate</small>
        </span>

        <svg class="flechaAviso" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>

    `;

    bloque.innerHTML = `

        <div class="tarjetaGrabados">

            <svg class="anilloGrabados" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="44" fill="none" stroke="#6e3826" stroke-width="2"/>
                <circle cx="50" cy="50" r="30" fill="none" stroke="#6e3826" stroke-width="1.2"/>
                <path d="M50 6 L50 14 M50 86 L50 94 M6 50 L14 50 M86 50 L94 50" stroke="#6e3826" stroke-width="2" stroke-linecap="round"/>
                <path d="M50 38 C51.5 46 54 48.5 62 50 C54 51.5 51.5 54 50 62 C48.5 54 46 51.5 38 50 C46 48.5 48.5 46 50 38 Z" fill="#6e3826"/>
            </svg>

            <div>

                <h2>Grabados personalizados</h2>

                <p>Tu nombre, una frase, un escudo o un logo grabado en la virola del mate. Es un regalo único. Te mostramos el diseño antes de grabar.</p>

            </div>

            <a class="pedir" href="${link}" target="_blank" rel="noopener">
                ${ICONO_WHATSAPP}
                Consultar por WhatsApp
            </a>

        </div>

    `;

}

function dibujarCierre(){

    const instagram = String(catalogo.instagram || "").trim().replace(/^@/, "");

    document.getElementById("cierre").innerHTML = `

        <img class="logoCierre" src="${ISOTIPO}" alt="Tomate un Mate">

        ${instagram
            ? `<p>Seguinos en <a href="https://instagram.com/${encodeURIComponent(instagram)}" target="_blank" rel="noopener">@${esc(instagram)}</a></p>`
            : ""
        }

    `;

}

// ---------- Interacciones ----------

document.getElementById("categorias").addEventListener("click", evento => {

    const boton = evento.target.closest(".enlaceCategoria");

    if(!boton) return;

    categoriaActiva = boton.dataset.categoria;

    dibujarCategorias();

    dibujarProductos();

    document.getElementById("contenido").scrollIntoView({ behavior: "smooth" });

});

// Flechas del carrusel de fotos (para computadora, donde no se desliza con el dedo)
document.getElementById("contenido").addEventListener("click", evento => {

    const flecha = evento.target.closest(".flecha");

    if(!flecha) return;

    const carrusel = flecha.closest(".visor").querySelector(".carrusel");

    carrusel.scrollBy({
        left: Number(flecha.dataset.dir) * carrusel.clientWidth,
        behavior: "smooth"
    });

});

// Los puntitos siguen a la foto que se está viendo
document.getElementById("contenido").addEventListener("scroll", evento => {

    const carrusel = evento.target;

    if(!carrusel.classList || !carrusel.classList.contains("carrusel")) return;

    const actual = Math.round(carrusel.scrollLeft / carrusel.clientWidth);

    carrusel.parentElement
        .querySelectorAll(".puntos span")
        .forEach((punto, i) => punto.classList.toggle("activo", i === actual));

}, true);

// ---------- Foto en grande ----------
// Al tocar una foto se abre a pantalla completa. Con varias fotos
// se pasan con las flechas, el teclado (← →) o deslizando.

const visor = document.getElementById("visorGrande");
const tiraVisor = document.getElementById("tiraVisor");

let elementoQueAbrio = null;
let temporizadorVisor = null;

function actualizarContadorVisor(){

    const total = tiraVisor.children.length;

    const actual = Math.round(tiraVisor.scrollLeft / (tiraVisor.clientWidth || 1)) + 1;

    document.getElementById("contadorVisor").textContent =
        total > 1 ? actual + " / " + total : "";

}

function abrirVisor(producto, indice){

    clearTimeout(temporizadorVisor);

    tiraVisor.innerHTML = producto.fotos
        .map(url => `<img src="${esc(url)}" alt="${esc(normalizarTexto(producto.titulo))}">`)
        .join("");

    document.getElementById("tituloVisor").textContent = normalizarTexto(producto.titulo);

    const hayVarias = producto.fotos.length > 1;

    document.getElementById("visorAnterior").hidden = !hayVarias;
    document.getElementById("visorSiguiente").hidden = !hayVarias;

    elementoQueAbrio = document.activeElement;

    visor.hidden = false;

    document.body.classList.add("sinScroll");

    // Se posiciona en la foto tocada sin animación
    tiraVisor.style.scrollSnapType = "none";
    tiraVisor.scrollLeft = indice * tiraVisor.clientWidth;

    // Se vuelve a fijar en el cuadro siguiente por si el navegador
    // todavía no había terminado de medir las fotos.
    requestAnimationFrame(() => {

        tiraVisor.scrollLeft = indice * tiraVisor.clientWidth;

        tiraVisor.style.scrollSnapType = "";

        actualizarContadorVisor();

    });

    actualizarContadorVisor();

    // Fuerza el cálculo de estilos para que la entrada se anime
    void visor.offsetWidth;

    visor.classList.add("abierto");

    document.getElementById("cerrarVisor").focus();

}

function cerrarVisor(){

    if(visor.hidden) return;

    visor.classList.remove("abierto");

    document.body.classList.remove("sinScroll");

    // La salida es más corta que la entrada (150 ms)
    temporizadorVisor = setTimeout(() => {

        visor.hidden = true;

        tiraVisor.innerHTML = "";

    }, 150);

    if(elementoQueAbrio && elementoQueAbrio.focus){
        elementoQueAbrio.focus();
    }

}

function moverVisor(direccion, animado){

    tiraVisor.scrollBy({
        left: direccion * tiraVisor.clientWidth,
        behavior: animado ? "smooth" : "auto"
    });

}

document.getElementById("contenido").addEventListener("click", evento => {

    const foto = evento.target.closest(".foto.conFotos");

    if(!foto || evento.target.closest(".flecha")) return;

    const id = foto.closest(".pieza").dataset.id;

    const producto = catalogo.productos.find(p => String(p.id) === id);

    if(!producto) return;

    const imagen = evento.target.closest("img");

    const indice = imagen ? Number(imagen.dataset.i) || 0 : 0;

    abrirVisor(producto, Math.min(indice, producto.fotos.length - 1));

});

document.getElementById("cerrarVisor").addEventListener("click", cerrarVisor);

// Click en el fondo oscuro (no sobre la foto ni los botones) cierra
visor.addEventListener("click", evento => {

    if(evento.target === visor || evento.target.closest(".pieVisor")){
        cerrarVisor();
    }

});

visor.addEventListener("click", evento => {

    const flecha = evento.target.closest(".flechaVisor");

    if(flecha){
        moverVisor(Number(flecha.dataset.dir), true);
    }

});

tiraVisor.addEventListener("scroll", actualizarContadorVisor, { passive: true });

document.addEventListener("keydown", evento => {

    if(visor.hidden) return;

    if(evento.key === "Escape"){
        cerrarVisor();
        return;
    }

    // Con el teclado el cambio es instantáneo, sin animación
    if(evento.key === "ArrowRight"){ moverVisor(1, false); }

    if(evento.key === "ArrowLeft"){ moverVisor(-1, false); }

    // El foco no se escapa a la página de atrás
    if(evento.key === "Tab"){

        const botones = [...visor.querySelectorAll("button")].filter(b => !b.hidden && b.offsetParent !== null);

        if(!botones.length) return;

        const primero = botones[0];
        const ultimo = botones[botones.length - 1];

        if(evento.shiftKey && document.activeElement === primero){
            evento.preventDefault();
            ultimo.focus();
        }else if(!evento.shiftKey && document.activeElement === ultimo){
            evento.preventDefault();
            primero.focus();
        }

    }

});

// Si el link trae "?p=15", se abre directo ese producto: con fotos,
// la primera en grande; sin fotos, se lo deja a la vista.
let linkProcesado = false;

function abrirProductoDelLink(){

    if(linkProcesado) return;

    const id = new URLSearchParams(location.search).get("p");

    if(!id){

        linkProcesado = true;

        return;

    }

    const producto = catalogo.productos.find(p => String(p.id) === id);

    // Si todavía no está (se está mostrando una copia vieja), se
    // vuelve a intentar cuando llegue la versión nueva.
    if(!producto) return;

    linkProcesado = true;

    if(producto.fotos && producto.fotos.length){

        abrirVisor(producto, 0);

        return;

    }

    const pieza = document.querySelector('.pieza[data-id="' + CSS.escape(String(producto.id)) + '"]');

    if(pieza) pieza.scrollIntoView({ block: "center" });

}

// ---------- Carga ----------
// 1) Si ya se visitó antes, se muestra AL INSTANTE la última copia que
//    quedó guardada en este teléfono/computadora.
// 2) En paralelo se pide la versión actual al servidor y, si cambió
//    algo, se redibuja sola.
// 3) Mientras la página está abierta se vuelve a revisar cada minuto
//    (y al volver a la pestaña), así lo que se cargó en la app aparece
//    sin tener que refrescar.

const CLAVE_LOCAL = "tomateUnMateCatalogo_v1";

let textoMostrado = "";
let ultimaRevision = 0;

function mostrarCatalogoCompleto(datos, texto){

    if(texto === textoMostrado) return;

    // No se redibuja mientras hay una foto en grande abierta: se aplica
    // en la próxima revisión.
    if(!visor.hidden) return;

    textoMostrado = texto;

    catalogo = datos;

    if(categoriaActiva !== "Todos" && !categoriasDisponibles().includes(categoriaActiva)){
        categoriaActiva = "Todos";
    }

    dibujarCategorias();

    dibujarProductos();

    dibujarGrabados();

    dibujarCierre();

    abrirProductoDelLink();

}

function revisarCatalogo(){

    ultimaRevision = Date.now();

    return fetch(API_CATALOGO, { cache: "no-store" })

        .then(respuesta => respuesta.text())

        .then(texto => {

            const datos = JSON.parse(texto);

            if(datos.error) throw new Error(datos.error);

            try{ localStorage.setItem(CLAVE_LOCAL, texto); }catch(e){}

            mostrarCatalogoCompleto(datos, texto);

        });

}

try{

    const guardado = localStorage.getItem(CLAVE_LOCAL);

    if(guardado){

        const datos = JSON.parse(guardado);

        if(datos && Array.isArray(datos.productos)){

            mostrarCatalogoCompleto(datos, guardado);

        }

    }

}catch(e){}

revisarCatalogo().catch(() => {

    // Si ya había una copia en pantalla, se deja esa; si no, se avisa
    if(!textoMostrado){

        document.getElementById("contenido").innerHTML =
            `<div class="grilla"><div class="mensaje">No pudimos cargar el catálogo. Probá de nuevo en unos minutos.</div></div>`;

    }

});

setInterval(() => {

    if(document.visibilityState === "visible"){
        revisarCatalogo().catch(() => {});
    }

}, 60000);

document.addEventListener("visibilitychange", () => {

    if(document.visibilityState === "visible" && Date.now() - ultimaRevision > 20000){
        revisarCatalogo().catch(() => {});
    }

});

</script>
