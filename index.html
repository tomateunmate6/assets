<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tomate un Mate</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6e3826">

<!-- Esto es lo que Apps Script no nos deja controlar: acá SÍ
     funciona, porque esta página es la de "afuera" de verdad. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tomate un Mate">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg">
<link rel="icon" href="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg">

<style>

  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}

  body{
    background:#f8f5f2;
    color:#2f241e;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .caja{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    max-width:340px;
  }

  img{
    width:96px;
    height:96px;
    border-radius:20px;
    object-fit:cover;
    box-shadow:0 10px 24px rgba(45,25,15,.15);
  }

  h1{
    font-size:20px;
    color:#6e3826;
    margin-top:4px;
  }

  p{
    font-size:14px;
    color:#8a7f75;
    margin-top:-6px;
    line-height:1.5;
  }

  .spinner{
    width:26px;
    height:26px;
    border:3px solid #e7ddd7;
    border-top-color:#6e3826;
    border-radius:50%;
    animation:girar 0.8s linear infinite;
  }

  @keyframes girar{
    to{ transform:rotate(360deg); }
  }

  .pasos{
    background:white;
    border:1px solid #e7ddd7;
    border-radius:14px;
    padding:16px 18px;
    text-align:left;
    font-size:14px;
    line-height:1.7;
    color:#2f241e;
    width:100%;
  }

  .pasos b{
    color:#6e3826;
  }

  a.abrir{
    margin-top:6px;
    display:inline-block;
    background:#6e3826;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    width:100%;
  }

</style>

</head>
<body>

  <!-- A propósito NO tiene la imagen del logo acá adentro: si
       estamos en modo app, redirigimos enseguida y no queremos
       que se llegue a pedir la imagen (por eso a veces se veía
       "rota" a mitad de camino). Solo se agrega si hace falta
       mostrar las instrucciones. -->
  <div class="caja" id="caja">

    <div class="spinner"></div>

  </div>

  <script>

    const URL_APP = "https://script.google.com/macros/s/AKfycbxSs3gY2FU4v1eaLfsRXmk5aNT_JBqKHj1j37rSlkBbc1Bb7c2aRNoGRg9pKlGVxA-Y/exec";

    // Solo redirige sola cuando ya la abriste desde el ícono que
    // agregaste a la pantalla de inicio (eso es "modo standalone").
    // Si la estás viendo en el navegador normal, se queda quieta
    // mostrando los pasos, para darte tiempo a agregarla.

    const enModoApp =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;

    if(enModoApp){

        window.location.replace(URL_APP);

    }else{

        document.getElementById("caja").innerHTML = `

            <img src="https://raw.githubusercontent.com/tomateunmate6/assets/main/logo.jpeg" alt="Tomate un Mate">

            <h1>Tomate un Mate</h1>

            <p>Para tenerla como una app en tu celular:</p>

            <div class="pasos">

                1. Tocá el botón <b>Compartir</b> (el cuadrado con la flecha, abajo en Safari)<br><br>
                2. Elegí <b>"Agregar a pantalla de inicio"</b><br><br>
                3. Listo — a partir de ahora abrila desde ese ícono nuevo

            </div>

            <a class="abrir" href="${URL_APP}">
                Abrir la app ahora (sin instalar)
            </a>

        `;

    }

  </script>

</body>
</html>
